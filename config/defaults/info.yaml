# App-wide defaults for course info. Rarely needed — info is mostly
# auto-generated per course (info.generated.yaml) and overridden in
# config/courses/<id>/info.yaml. Schema: packages/course-config/src/schema.ts

grading:
  # Letter cutoffs used when a course doesn't define its own scheme.
  scheme:
    A: 93
    A-: 90
    B+: 87
    B: 83
    B-: 80
    C+: 77
    C: 73
    C-: 70
    D+: 67
    D: 63
    D-: 60
    F: 0
